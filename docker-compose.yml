services:
  backend:
    build:
      context: .
      dockerfile: backend/madhavconstruction/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/madhavconstruction}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: madhavConstruction-frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8000:80"
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data: